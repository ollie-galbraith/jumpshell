name: Build Jumpshell

on:
  push:
    branches:
      - main
    paths:
      - 'src/JumpShell/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/JumpShell/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: Build JumpShell
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      arm64_sha: ${{ steps.checksums.outputs.arm64_sha }}
      x64_sha: ${{ steps.checksums.outputs.x64_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        run: echo "version=$(dotnet msbuild src/JumpShell/JumpShell.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Verify version is newer than latest release
        if: github.event_name == 'push'
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            echo "No previous release tag found; allowing the first release."
            exit 0
          fi

          latest_version=${latest_tag#v}
          newest_version=$(printf '%s\n%s\n' "$latest_version" "$CURRENT_VERSION" | sort -V | tail -n 1)
          if [ "$CURRENT_VERSION" = "$latest_version" ] || [ "$newest_version" != "$CURRENT_VERSION" ]; then
            echo "Project version $CURRENT_VERSION must be newer than the latest release $latest_tag."
            exit 1
          fi

          echo "Project version $CURRENT_VERSION is newer than the latest release $latest_tag."

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore dependencies
        run: dotnet restore src/JumpShell/JumpShell.csproj

      - name: Build
        run: |
          dotnet publish src/JumpShell/JumpShell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
          dotnet publish src/JumpShell/JumpShell.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true
          dotnet publish src/JumpShell/JumpShell.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true
          dotnet publish src/JumpShell/JumpShell.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true
          dotnet publish src/JumpShell/JumpShell.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true

      - name: Calculate macOS SHA-256
        id: checksums
        run: |
          echo "arm64_sha=$(sha256sum bin/jumpshell-osx-arm64 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$(sha256sum bin/jumpshell-osx-x64 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event_name == 'push'
        id: use-go-action
        uses: softprops/action-gh-release@v3
        with:
          files: |-
            bin/**
          tag_name: v${{ steps.version.outputs.version }}
          token: ${{ secrets.PUSH_TOKEN }}

  update-homebrew:
    name: Update Homebrew formula
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: ollie-galbraith/homebrew-jumpshell
          token: ${{ secrets.PUSH_TOKEN }}
          path: homebrew-jumpshell

      - name: Update formula
        working-directory: homebrew-jumpshell
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARM64_SHA: ${{ needs.build.outputs.arm64_sha }}
          X64_SHA: ${{ needs.build.outputs.x64_sha }}
        run: |
          ruby <<'RUBY'
          path = "Formula/jumpshell.rb"
          formula = File.read(path)

          raise "Could not update formula version" unless formula.sub!(/^  version "[^"]+"$/, "  version \"#{ENV.fetch('VERSION')}\"")
          raise "Could not update arm64 checksum" unless formula.sub!(/(url ".*jumpshell-osx-arm64"\n\s+sha256 ")[0-9a-f]+("\n)/) { "#{$1}#{ENV.fetch('ARM64_SHA')}#{$2}" }
          raise "Could not update x64 checksum" unless formula.sub!(/(url ".*jumpshell-osx-x64"\n\s+sha256 ")[0-9a-f]+("\n)/) { "#{$1}#{ENV.fetch('X64_SHA')}#{$2}" }

          File.write(path, formula)
          RUBY

      - name: Commit and push formula update
        working-directory: homebrew-jumpshell
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jumpshell.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "Update jumpshell to ${VERSION}"
          git push